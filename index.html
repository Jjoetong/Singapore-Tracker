// ── CALCULATIONS ──────────────────────────────────────────────────────
// Bank = MYR account (all non-wallet transactions)
// Cash Wallet = physical SGD cash (pay:'wallet' transactions + ATM SGD received)

function calc() {
  var bankIncome = 0, bankOut = 0;
  var atmCashIn = 0;
  var cashIn = 0, cashOut = 0;
  var totalExp = 0;
  var cardBal = 0;

  txs.forEach(function(tx) {
    var isCash = tx.pay === 'wallet';

    if (tx.catId === 'c15') {
      // ATM: MYR debit goes against bank; SGD received enters cash wallet
      bankOut += tx.amount;
      atmCashIn += (tx.atmSGD !== undefined ? tx.atmSGD : tx.amount);
      totalExp += tx.amount;
      return;
    }

    if (tx.type === 'income') {
      if (isCash) cashIn += tx.amount;
      else bankIncome += tx.amount;
    } else if (tx.type === 'expense') {
      totalExp += tx.amount;
      if (isCash) {
        cashOut += tx.amount;
      } else if (tx.pay === 'card') {
        cardBal += tx.amount;
        bankOut += tx.amount;
      } else if (tx.catId === 'c10') {
        cardBal = Math.max(0, cardBal - tx.amount);
        bankOut += tx.amount;
      } else {
        bankOut += tx.amount;
      }
    }
  });

  var bankSGD   = bankIncome - bankOut;
  var cashWallet = cashIn + atmCashIn - cashOut;

  // Use live rate for net worth conversion (Rec 2)
  var bankSGDatLive = bankSGD; // bank is already stored as SGD-equivalent using historical rate
  // Re-derive the original MYR amount and convert at live rate for accuracy
  // bankSGD was computed using R=3.48; real MYR balance = bankSGD * R, then / liveRate gives live SGD
  var bankMYR_orig    = bankSGD * R;           // original MYR balance
  var bankSGD_live    = bankMYR_orig / liveRate; // SGD equivalent at live rate
  var netWorthLive    = bankSGD_live + cashWallet;

  return {
    bankSGD:      bankSGD,
    bankSGD_live: bankSGD_live,
    bankMYR:      bankMYR_orig,
    cashWallet:   cashWallet,
    netWorth:     netWorthLive,       // now uses live rate
    netWorthHist: bankSGD + cashWallet, // historical-rate version (kept for vault calc)
    totalExp:     totalExp,
    totalIncome:  bankIncome + cashIn,
    cardBal:      cardBal
  };
}

// ── MONTH HELPERS ─────────────────────────────────────────────────────

// Returns sorted list of 'YYYY-MM' strings present in txs
function getMonthList() {
  var seen = {};
  txs.forEach(function(t){ if(t.date) seen[t.date.slice(0,7)] = 1; });
  return Object.keys(seen).sort();
}

// calc() scoped to a specific 'YYYY-MM' month (or all if empty)
function calcForMonth(ym) {
  var subset = ym ? txs.filter(function(t){ return t.date && t.date.slice(0,7) === ym; }) : txs;
  var bankIncome=0, bankOut=0, atmCashIn=0, cashIn=0, cashOut=0, totalExp=0, cardBal=0;
  subset.forEach(function(tx) {
    var isCash = tx.pay === 'wallet';
    if (tx.catId === 'c15') {
      bankOut += tx.amount;
      atmCashIn += (tx.atmSGD !== undefined ? tx.atmSGD : tx.amount);
      totalExp += tx.amount;
      return;
    }
    if (tx.type === 'income') {
      if (isCash) cashIn += tx.amount; else bankIncome += tx.amount;
    } else if (tx.type === 'expense') {
      totalExp += tx.amount;
      if (isCash) cashOut += tx.amount;
      else if (tx.pay === 'card') { cardBal += tx.amount; bankOut += tx.amount; }
      else if (tx.catId === 'c10') { cardBal = Math.max(0, cardBal - tx.amount); bankOut += tx.amount; }
      else bankOut += tx.amount;
    }
  });
  var bankSGD = bankIncome - bankOut;
  var bankMYR_orig = bankSGD * R;
  var bankSGD_live = bankMYR_orig / liveRate;
  var cw = cashIn + atmCashIn - cashOut;
  return {
    bankSGD:     bankSGD,
    bankSGD_live: bankSGD_live,
    bankMYR:     bankMYR_orig,
    cashWallet:  cw,
    netWorth:    bankSGD_live + cw,
    totalExp:    totalExp,
    totalIncome: bankIncome + cashIn,
    savingsNet:  (bankIncome + cashIn) - totalExp
  };
}

// ── RESERVE VAULT HISTORY ─────────────────────────────────────────────
var VAULT_TARGET = 1000; // SGD

// For each past completed month, compute net savings (income - expenses in SGD)
// Current month is "in progress"
function vaultHistory() {
  var months = getMonthList();
  var now = new Date();
  var currentYM = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'));
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months.map(function(ym) {
    var mc = calcForMonth(ym);
    var parts = ym.split('-');
    var label = MONTH_NAMES[parseInt(parts[1])-1] + ' ' + parts[0];
    var isCurrent = ym === currentYM;
    var saved = mc.savingsNet; // net in SGD for that month
    var hit = saved >= VAULT_TARGET;
    return { ym:ym, label:label, saved:saved, hit:hit, isCurrent:isCurrent };
  });
}

// ── DAILY SPEND TARGET ────────────────────────────────────────────────
function dailySpendInfo() {
  var now = new Date();
  var ym = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'));
  var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var dayOfMonth = now.getDate();
  var daysLeft = daysInMonth - dayOfMonth + 1; // including today

  // Monthly income (salary-type only, not gambling wins or dad transfers for this calc)
  var monthlyIncome = txs
    .filter(function(t){ return t.date && t.date.slice(0,7)===ym && t.type==='income' && t.catId==='c1'; })
    .reduce(function(s,t){ return s+t.amount; }, 0);

  // Total expenses so far this month
  var monthExp = txs
    .filter(function(t){ return t.date && t.date.slice(0,7)===ym && t.type==='expense'; })
    .reduce(function(s,t){ return s+t.amount; }, 0);

  // Budget ceiling = income - vault target (what can be spent total this month)
  var spendBudget = Math.max(0, monthlyIncome - VAULT_TARGET);

  // Today's expenses
  var todayStr = now.toISOString().slice(0,10);
  var todayExp = txs
    .filter(function(t){ return t.date === todayStr && t.type==='expense'; })
    .reduce(function(s,t){ return s+t.amount; }, 0);

  // Daily ceiling = remaining spendable / days left
  var remaining = Math.max(0, spendBudget - monthExp + todayExp); // re-add today since "days left" includes today
  var dailyCeil = daysLeft > 0 ? remaining / daysLeft : 0;

  return {
    dailyCeil:   dailyCeil,
    todayExp:    todayExp,
    daysLeft:    daysLeft,
    spendBudget: spendBudget,
    monthExp:    monthExp,
    pct:         spendBudget > 0 ? Math.min(100, (monthExp / spendBudget) * 100) : 0
  };
}



function fmt(sgdAmt, origAmt, origCur) {
  if (isDiscreet) return '••••';
  var rate = baseCur === 'MYR' ? liveRate : 1;
  var sym  = baseCur === 'MYR' ? 'RM ' : 'S$';
  var val;
  if (origCur && origCur === baseCur && origAmt !== undefined) {
    val = origAmt;
  } else {
    val = sgdAmt * rate;
  }
  return sym + val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function cat(id) {
  return CATS.find(function(c){return c.id===id}) || {name:'Other',icon:'•',bg:'#1e293b',col:'#94a3b8'};
}

  var summaryHtml = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px">'

    + '<div class="card-sm" style="text-align:center"><div class="label" style="margin-bottom:6px">Months Hit</div>'
    + '<div style="font-size:20px;font-weight:700;color:#34d399">'+completedCount+'/'+totalPast+'</div></div>'
    + '<div class="card-sm" style="text-align:center"><div class="label" style="margin-bottom:6px">Streak</div>'
    + '<div style="font-size:20px;font-weight:700;color:#a5b4fc">'+streak+'</div></div>'

// ── DONUT CHART (Rec 3) ───────────────────────────────────────────────
function buildDonut(slices, cx, cy, r, stroke) {
  // slices: [{pct, col}]
  var total = slices.reduce(function(s,sl){return s+sl.pct;},0);
  if (total <= 0) return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#1e293b" stroke-width="'+stroke+'"/>';
  var svgParts = '';
  var circ = 2 * Math.PI * r;
  var offset = 0;
  slices.forEach(function(sl){
    var dash = (sl.pct / total) * circ;
    var gap  = circ - dash;
    svgParts += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'"'
      + ' fill="none" stroke="'+sl.col+'" stroke-width="'+stroke+'"'
      + ' stroke-dasharray="'+dash.toFixed(2)+' '+gap.toFixed(2)+'"'
      + ' stroke-dashoffset="'+(-offset).toFixed(2)+'"'
      + ' transform="rotate(-90 '+cx+' '+cy+')" />';
    offset += dash;
  });
  return svgParts;
}

// ── WEEKLY WATERFALL (Rec 5) ──────────────────────────────────────────
function renderWeeklyWaterfall(scopedTxs, ym) {
  if (!ym) return '';

  var parts   = ym.split('-');
  var year    = parseInt(parts[0]);
  var month   = parseInt(parts[1]) - 1;
  var daysInM = new Date(year, month+1, 0).getDate();

  // Build week buckets: week 1 = days 1-7, week 2 = 8-14, week 3 = 15-21, week 4 = 22+
  var weeks = [
    {label:'Wk 1', days:[1,7],  in:0, out:0},
    {label:'Wk 2', days:[8,14], in:0, out:0},
    {label:'Wk 3', days:[15,21],in:0, out:0},
    {label:'Wk 4', days:[22,daysInM], in:0, out:0},
  ];

  scopedTxs.forEach(function(t){
    if (!t.date) return;
    var day = parseInt(t.date.split('-')[2]);
    var wk  = day <= 7 ? 0 : day <= 14 ? 1 : day <= 21 ? 2 : 3;
    if (t.type === 'income') weeks[wk].in  += t.amount;
    else if (t.type === 'expense' && t.catId !== 'c15') weeks[wk].out += t.amount;
  });

  var maxAbs = 0;
  weeks.forEach(function(w){
    maxAbs = Math.max(maxAbs, Math.abs(w.in - w.out), w.in, w.out);
  });
  if (maxAbs === 0) maxAbs = 1;

  var BAR_H = 80;   // max bar height in px
  var BAR_W = 36;
  var GAP   = 16;
  var totalW = weeks.length * (BAR_W * 2 + GAP + 12);  // 2 bars + gap per week
  var svgH   = BAR_H + 48;

  var bars = weeks.map(function(w, i){
    var inH   = Math.max(2, (w.in  / maxAbs) * BAR_H);
    var outH  = Math.max(2, (w.out / maxAbs) * BAR_H);
    var net   = w.in - w.out;
    var netCol= net >= 0 ? '#34d399' : '#f87171';
    var xBase = i * (BAR_W * 2 + GAP + 12);

    return '<g transform="translate('+xBase+',0)">'
      // Income bar
      + '<rect x="0" y="'+(BAR_H-inH)+'" width="'+BAR_W+'" height="'+inH+'" rx="4" fill="rgba(52,211,153,.5)"/>'
      // Expense bar
      + '<rect x="'+(BAR_W+6)+'" y="'+(BAR_H-outH)+'" width="'+BAR_W+'" height="'+outH+'" rx="4" fill="rgba(248,113,113,.5)"/>'
      // Week label
      + '<text x="'+(BAR_W)+'" y="'+(BAR_H+14)+'" text-anchor="middle" fill="#475569" font-size="9" font-weight="700" font-family="-apple-system,sans-serif">'+w.label+'</text>'
      // Net label
      + '<text x="'+(BAR_W)+'" y="'+(BAR_H+26)+'" text-anchor="middle" fill="'+netCol+'" font-size="8" font-weight="700" font-family="-apple-system,sans-serif">'+(net>=0?'+':'')+fmt(Math.abs(net)).replace(/^(RM |S\$)/,'')+'</text>'
      + '</g>';
  }).join('');

  return '<div class="card" style="margin-bottom:16px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    + '<div style="font-size:14px;font-weight:600;color:#e2e8f0">Weekly Cash Flow</div>'
    + '<div style="display:flex;gap:12px;align-items:center">'
    + '<div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(52,211,153,.5)"></div><span style="font-size:9px;color:#475569;font-weight:600">In</span></div>'
    + '<div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:rgba(248,113,113,.5)"></div><span style="font-size:9px;color:#475569;font-weight:600">Out</span></div>'
    + '</div></div>'
    + '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
    + '<svg width="'+totalW+'" height="'+svgH+'" viewBox="0 0 '+totalW+' '+svgH+'">'
    + bars
    + '</svg></div></div>';
}

function renderGamble() {
  // ── GAMBLING ──
  var gambTxs  = txs.filter(function(t){return t.catId==='c13'});
  var gambLoss = gambTxs.filter(function(t){return t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
  var gambWin  = gambTxs.filter(function(t){return t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
  var gambNet  = gambWin - gambLoss;
  var gambCol  = gambNet >= 0 ? '#34d399' : '#f87171';
  var winRate  = (gambTxs.filter(function(t){return t.type==='income'}).length /
                 Math.max(1, gambTxs.length) * 100).toFixed(0);

  // session rows (group by date)
  var sessionMap = {};
  gambTxs.forEach(function(t){
    if (!sessionMap[t.date]) sessionMap[t.date] = {in:0,out:0};
    if (t.type==='income') sessionMap[t.date].in += t.amount;
    else sessionMap[t.date].out += t.amount;
  });
  var sessionDates = Object.keys(sessionMap).sort(function(a,b){return new Date(b)-new Date(a)});
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var sessionRows = sessionDates.map(function(d){
    var s = sessionMap[d];
    var net = s.in - s.out;
    var col = net >= 0 ? '#34d399' : '#f87171';
    var dp  = d.split('-');
    var label = parseInt(dp[2]) + ' ' + months[parseInt(dp[1])-1];
    return '<div class="card-row" style="margin-bottom:8px">'
      + '<div style="display:flex;align-items:center;gap:14px">'
      + '<div class="icon-wrap" style="background:rgba(168,85,247,.1)">🎲</div>'
      + '<div><div style="font-size:13px;font-weight:500;color:#e2e8f0">Session — '+label+'</div>'
      + '<div style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#475569;margin-top:3px">'
      + 'In: '+fmt(s.in)+' · Out: '+fmt(s.out)+'</div></div></div>'
      + '<div style="font-size:14px;font-weight:700;color:'+col+'">'+(net>=0?'+':'')+fmt(Math.abs(net))+'</div>'
      + '</div>';
  }).join('');

  // ── INVESTMENTS ──
  var investDeposited = txs.filter(function(t){return t.catId==='c9'&&t.type==='expense'}).reduce(function(s,t){return s+t.amount},0);
  var investReturn    = txs.filter(function(t){return t.catId==='c9'&&t.type==='income'}).reduce(function(s,t){return s+t.amount},0);
  var investNet       = investReturn - investDeposited;
  var investCol       = investNet >= 0 ? '#34d399' : '#f87171';

  return '<div class="title" style="margin-bottom:20px">Gambling & Investing</div>'

    // ── Gambling summary card ──
    + '<div class="card amberglow" style="margin-bottom:16px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
    + '<span class="label">Gambling P&L</span>'
    + '<span style="font-size:9px;font-weight:700;letter-spacing:.1em;background:rgba(168,85,247,.1);color:#c084fc;padding:3px 8px;border-radius:4px">Win Rate '+winRate+'%</span>'
    + '</div>'
    + '<div style="font-size:40px;font-weight:600;color:'+gambCol+';letter-spacing:-.02em">'+(isDiscreet?'••••':(gambNet>=0?'+':'')+fmt(Math.abs(gambNet)))+'</div>'
    + '<div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid rgba(255,255,255,.06);padding-top:16px">'
    + '<div><div class="nw-cell-label">Total Staked</div><div class="nw-cell-val" style="color:#f87171">'+fmt(gambLoss)+'</div></div>'
    + '<div><div class="nw-cell-label">Total Returned</div><div class="nw-cell-val" style="color:#34d399">'+fmt(gambWin)+'</div></div>'
    + '</div></div>'

    // ── Session log ──
    + '<div style="margin-bottom:24px"><div class="sec-hdr"><span class="sec-title">Session Log</span></div>'
    + (sessionRows || '<div style="font-size:12px;color:#475569;text-align:center;padding:16px">No sessions recorded</div>')
    + '</div>'

    // ── Investments ──
    + '<div class="sec-hdr"><span class="sec-title">Investments</span></div>'
    + '<div class="card" style="margin-bottom:12px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'
    + '<span class="label">Portfolio P&L</span>'
    + '<span style="font-size:14px;font-weight:700;color:'+investCol+'">'+(isDiscreet?'••••':(investNet>=0?'+':'')+fmt(Math.abs(investNet)))+'</span>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    + '<div><div class="nw-cell-label">Deployed</div><div class="nw-cell-val">'+fmt(investDeposited)+'</div></div>'
    + '<div><div class="nw-cell-label">Returned</div><div class="nw-cell-val">'+fmt(investReturn)+'</div></div>'
    + '</div></div>'
    + '<div class="card-row" style="margin-bottom:8px">'

function renderLedgerBody() {
  var sorted = txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  var months  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var lastDate = '';
  var html = '';
  sorted.forEach(function(tx) {
    if (tx.date !== lastDate) {
      var dp = tx.date.split('-');
      var dayLabel = parseInt(dp[2]) + ' ' + months[parseInt(dp[1])-1] + ' ' + dp[0];
      var dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(tx.date).getDay()];
      html += '<div style="font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#475569;margin:16px 0 8px;padding:0 2px">'
        + dow + ', ' + dayLabel + '</div>';
      lastDate = tx.date;
    }
    html += txRow(tx, true);
  });
  return html;
}

function openLedger() {
  var el = document.getElementById('app');
  var fs = document.createElement('div');

function closeLedger() {
  var el = document.getElementById('ledger-fs');
  if (el) el.parentNode.removeChild(el);
}

function deleteTx(id) {
  txs = txs.filter(function(t){return t.id !== id});
  saveTxs(); render();
  var lb = document.getElementById('ledger-body');
  if (lb) lb.innerHTML = renderLedgerBody();
}

function editTx(id) {
  var tx = txs.find(function(t){return t.id===id});
  if (!tx) return;
  var newVal = prompt('Edit amount (' + tx.cur + '):', tx.orig);
  if (newVal === null) return;
  var parsed = parseFloat(newVal);
  if (isNaN(parsed)) return;
  tx.orig   = parsed;
  tx.amount = tx.cur === 'MYR' ? parsed / liveRate : parsed;
  saveTxs(); render();
  var lb = document.getElementById('ledger-body');
  if (lb) lb.innerHTML = renderLedgerBody();
}

function setTxType(t)        { txType=t; selectedCatId=''; mealType=''; laundryType=''; renderModal(); }
function setPayMethod(m)     { payMethod=m; renderModal(); }
function setInputCur(c)      { inputCur=c; renderModal(); }
function selectCat(id)       { selectedCatId=id; mealType=''; laundryType=''; renderModal(); }
function setMeal(m)          { mealType=m; renderModal(); }
function setLaundry(l)       { laundryType=l; renderModal(); }
function setBudgetFilter(f)  { budgetFilter=f; render(); }
function setSelectedMonth(ym){ selectedMonth=ym; render(); }

function submitTx() {
  var amtEl  = document.getElementById('amt-input');
  var noteEl = document.getElementById('note-input');
  var dateEl = document.getElementById('date-input');
  if (!amtEl || !selectedCatId) { alert('Please fill in amount and select a category.'); return; }

  var origAmt = parseFloat(amtEl.value);
  if (isNaN(origAmt) || origAmt <= 0) { alert('Please enter a valid amount.'); return; }

  var sgdAmt   = inputCur === 'MYR' ? origAmt / liveRate : origAmt;
  var note     = (noteEl && noteEl.value) || 'Ledger Entry';
  var txDate   = (dateEl && dateEl.value && dateEl.value.match(/^\d{4}-\d{2}-\d{2}$/))
                 ? dateEl.value
                 : new Date().toISOString().slice(0,10);
  var finalType = txType === 'profit' ? 'pnl_profit' : txType === 'loss' ? 'pnl_loss' : txType;

  var newTx = {
    id:      Date.now(),
    date:    txDate,
    amount:  sgdAmt,
    orig:    origAmt,
    cur:     inputCur,
    catId:   selectedCatId,
    type:    finalType,
    pay:     txType === 'expense' ? payMethod : 'cash',
    note:    note,
    acct:    payMethod === 'wallet' ? 'cash' : 'bank'
  };

  if (selectedCatId === 'c15' && inputCur === 'MYR') {
    var sgdRecEl = document.getElementById('atm-sgd-input');
    if (sgdRecEl && sgdRecEl.value) {
      newTx.atmSGD = parseFloat(sgdRecEl.value) || sgdAmt;
    }
  }

  if (mealType) newTx.meal = mealType;
  if (laundryType) newTx.laundry = laundryType;

  txs.unshift(newTx);
  txs.sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  saveTxs();
  closeModal();
  render();
}

function closeBackup() {
  var el = document.getElementById('backup-fs');
  if (el) el.parentNode.removeChild(el);
}

function dlBlob(content, filename, mime) {
  var blob = new Blob([content], {type: mime});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); }, 500);
}

function exportCSV(scope) {
  var now = new Date();
  var ym  = now.getFullYear()+'-'+(String(now.getMonth()+1).padStart(2,'0'));
  var data = scope === 'month'
    ? txs.filter(function(t){ return t.date && t.date.slice(0,7) === ym; })
    : txs;

  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var header = 'Date,Category,Type,Payment,Currency,Original Amount,SGD Amount,Note,Meal,Laundry\n';
  var rows = data.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)}).map(function(t){
    var c = cat(t.catId);
    var dp = (t.date||'').split('-');
    var dateLabel = dp.length===3 ? (parseInt(dp[2])+' '+MONTH_NAMES[parseInt(dp[1])-1]+' '+dp[0]) : t.date;
    return [
      dateLabel,
      c.name,
      t.type,
      t.pay === 'wallet' ? 'Cash' : t.pay === 'card' ? 'UOB Card' : 'Bank',
      t.cur || 'SGD',
      (t.orig || t.amount).toFixed(2),
      t.amount.toFixed(4),
      '"'+(t.note||'').replace(/"/g,"''")+'"',
      t.meal || '',
      t.laundry || ''
    ].join(',');
  }).join('\n');

  var filename = scope === 'month'
    ? 'wealth-'+ym+'.csv'
    : 'wealth-all-time.csv';
  dlBlob(header + rows, filename, 'text/csv');
}

function exportJSON() {
  var ts = new Date().toISOString().slice(0,10);
  dlBlob(JSON.stringify({version:'pw_v12', exported:ts, transactions:txs}, null, 2),
    'wealth-backup-'+ts+'.json', 'application/json');
}

function restoreJSON(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var restored = data.transactions || data;
      if (!Array.isArray(restored)) throw new Error('Invalid format');
      if (!confirm('Restore '+restored.length+' transactions? Your current data will be replaced.')) return;
      txs = restored;
      saveTxs();
      closeBackup();
      render();
      alert('Restore successful. '+restored.length+' transactions loaded.');
    } catch(err) {
      alert('Restore failed: invalid or corrupted backup file.');
    }
  };
  reader.readAsText(file);
}
